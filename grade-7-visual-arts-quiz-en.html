<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 7 Visual Arts Revision Quiz</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f0f9ff;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --success: #10b981;
            --error: #ef4444;
            --border: #bae6fd;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0f2fe;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-card {
            margin-bottom: 20px;
        }
        .q-number {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .q-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0f9ff;
        }
        .option-btn.selected {
            border-color: var(--primary);
            background: #f0f9ff;
            font-weight: 600;
        }
        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--success);
            color: #065f46;
        }
        .option-btn.incorrect {
            background: #fee2e2;
            border-color: var(--error);
            color: #991b1b;
        }
        .feedback-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .feedback-box.correct {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }
        .feedback-box.incorrect {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }
        .action-btn {
            margin-top: 20px;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: var(--primary-hover);
        }
        .action-btn:disabled {
            background: #e2e8f0;
            color: var(--text-light);
            cursor: not-allowed;
        }
        .results-screen {
            text-align: center;
            display: none;
        }
        .score-badge {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin: 16px 0;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>🎨 Grade 7 Visual Arts Quiz</h1>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="quizContainer">
        <div class="question-card">
            <div class="q-number" id="qNumber">Question 1 of 10</div>
            <div class="q-text" id="qText">Loading question...</div>
            <div class="options-list" id="optionsList"></div>
            <div class="feedback-box" id="feedbackBox"></div>
        </div>
        <button class="action-btn" id="nextBtn" onclick="handleNext()" disabled>Submit Answer</button>
    </div>

    <div class="results-screen" id="resultsScreen">
        <h2>🎉 Quiz Completed!</h2>
        <p>Your Final Score:</p>
        <div class="score-badge" id="finalScore">0 / 10</div>
        <p id="scoreMessage" style="color: var(--text-light); margin-bottom: 24px;"></p>
        <button class="action-btn" onclick="restartQuiz()">Retake Quiz</button>
    </div>
</div>

<script>
const quizData = [
    {
        question: "Which art element refers specifically to the relative lightness or darkness of a color or surface?",
        options: ["Texture", "Value", "Line", "Space"],
        correct: 1
    },
    {
        question: "What design principle is used to distribute visual weight evenly or intentionally across an artwork?",
        options: ["Contrast", "Balance", "Rhythm", "Proportion"],
        correct: 1
    },
    {
        question: "What is the term for a large-scale artwork painted directly onto a wall, ceiling, or permanent surface?",
        options: ["Sketch", "Mural", "Portrait", "Still life"],
        correct: 1
    },
    {
        question: "Which professional is primarily responsible for designing building structures, drafting architectural blueprints, and ensuring safety compliance?",
        options: ["Graphic Designer", "Architect", "Sculptor", "Ceramist"],
        correct: 1
    },
    {
        question: "What does a landscape artwork primarily depict?",
        options: ["An indoor kitchen setup", "Natural outdoor scenery", "An abstract portrait of a family", "Geometric shapes only"],
        correct: 1
    },
    {
        question: "How does tactile texture differ fundamentally from visual texture in visual arts?",
        options: ["Tactile texture is real physical texture that can be felt by touch, while visual texture is an illusion created on a flat surface.", "Tactile texture is painted blue, while visual texture is painted red.", "There is no difference between them.", "Tactile texture only appears in photographs."],
        correct: 0
    },
    {
        question: "Which of the following describes how an artist can create emphasis in a composition?",
        options: ["Using the exact same color and size for every object", "By using a bright contrasting color against neutral tones or making one object significantly larger", "Leaving the canvas completely blank", "Using only fine pencil lines"],
        correct: 1
    },
    {
        question: "What is the key distinction between geometric shapes and organic shapes?",
        options: ["Geometric shapes are always blue, organic shapes are green.", "Geometric shapes follow precise mathematical rules, whereas organic shapes are free-form and irregular.", "Geometric shapes cannot be drawn on paper.", "Organic shapes are made of plastic."],
        correct: 1
    },
    {
        question: "In landscape visual literacy, how is depth perception typically achieved on a two-dimensional surface?",
        options: ["By making everything the exact same size", "Through overlapping layers, relative scale, and atmospheric perspective", "By using only black ink", "By putting the background objects in the foreground"],
        correct: 1
    },
    {
        question: "What is one primary purpose of painting murals in public community spaces?",
        options: ["To block sunlight completely", "To beautify shared environments, educate on cultural heritage, and foster community pride", "To replace street signs", "To advertise commercial products exclusively"],
        correct: 1
    }
];

let currentQuestion = 0;
let score = 0;
let selectedOption = null;
let isAnswerSubmitted = false;

const qNumberEl = document.getElementById("qNumber");
const qTextEl = document.getElementById("qText");
const optionsListEl = document.getElementById("optionsList");
const feedbackBoxEl = document.getElementById("feedbackBox");
const nextBtnEl = document.getElementById("nextBtn");
const progressFillEl = document.getElementById("progressFill");
const quizContainerEl = document.getElementById("quizContainer");
const resultsScreenEl = document.getElementById("resultsScreen");
const finalScoreEl = document.getElementById("finalScore");
const scoreMessageEl = document.getElementById("scoreMessage");

function loadQuestion() {
    isAnswerSubmitted = false;
    selectedOption = null;
    feedbackBoxEl.className = "feedback-box";
    feedbackBoxEl.innerHTML = "";
    nextBtnEl.innerText = "Submit Answer";
    nextBtnEl.disabled = true;

    const q = quizData[currentQuestion];
    qNumberEl.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
    qTextEl.innerText = q.question;
    progressFillEl.style.width = `${((currentQuestion) / quizData.length) * 100}%`;

    optionsListEl.innerHTML = "";
    q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectOption(index, btn);
        optionsListEl.appendChild(btn);
    });
}

function selectOption(index, btn) {
    if (isAnswerSubmitted) return;
    document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedOption = index;
    nextBtnEl.disabled = false;
}

function handleNext() {
    if (!isAnswerSubmitted) {
        isAnswerSubmitted = true;
        const q = quizData[currentQuestion];
        const buttons = document.querySelectorAll(".option-btn");

        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.correct) {
                btn.classList.add("correct");
            } else if (idx === selectedOption) {
                btn.classList.add("incorrect");
            }
        });

        if (selectedOption === q.correct) {
            score++;
            feedbackBoxEl.className = "feedback-box correct";
            feedbackBoxEl.innerHTML = "✅ <strong>Correct!</strong> Great job.";
        } else {
            feedbackBoxEl.className = "feedback-box incorrect";
            feedbackBoxEl.innerHTML = `❌ <strong>Incorrect.</strong> The correct answer is: <em>${q.options[q.correct]}</em>`;
        }

        if (currentQuestion < quizData.length - 1) {
            nextBtnEl.innerText = "Next Question →";
        } else {
            nextBtnEl.innerText = "View Results";
        }
    } else {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }
}

function showResults() {
    quizContainerEl.style.display = "none";
    resultsScreenEl.style.display = "block";
    progressFillEl.style.width = "100%";
    finalScoreEl.innerText = `${score} / ${quizData.length}`;

    let msg = "";
    const percentage = (score / quizData.length) * 100;
    if (percentage >= 80) {
        msg = "Excellent! You are a true artist in Visual Arts!";
    } else if (percentage >= 50) {
        msg = "Good job! You understand art concepts well. Keep practicing!";
    } else {
        msg = "Keep practicing! Review your notes and feel free to try again.";
    }
    scoreMessageEl.innerText = msg;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    quizContainerEl.style.display = "block";
    resultsScreenEl.style.display = "none";
    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
